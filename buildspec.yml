
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing dependencies...
      - npm ci

  build:
    commands:
      - echo Building portfolio...
      - npm run build

  post_build:
    commands:
      - echo Deploying portfolio to S3...
      - aws s3 sync dist/ s3://rilwana-cloud-portfolio/

artifacts:
  base-directory: dist
  files:
    - '**/*'
